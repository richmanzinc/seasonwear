<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SeasonWear — ブランド古着をシーズンで探す</title>
  <meta name="description" content="デザイナーズ・ラグジュアリーブランドの古着を、デリバリーシーズンとメンズ/ウィメンズで絞り込める楽天アフィリエイトのまとめサイト。" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <span class="logo">SEASON<span>WEAR</span></span>
        <span class="tagline">ブランド古着を、シーズンで探す</span>
      </div>
      <p class="ad-note">本サイトは楽天アフィリエイトによる広告（PR）を含みます</p>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="絞り込み">
      <div class="field">
        <label>性別</label>
        <div class="segmented" id="f-gender">
          <button data-val="all" class="active">すべて</button>
          <button data-val="MEN">メンズ</button>
          <button data-val="WOMEN">ウィメンズ</button>
        </div>
      </div>

      <div class="field">
        <label for="f-season">シーズン</label>
        <select id="f-season"><option value="all">すべてのシーズン</option></select>
      </div>

      <div class="field">
        <label for="f-sort">並び替え</label>
        <select id="f-sort">
          <option value="new">シーズン新しい順</option>
          <option value="price-asc">価格 安い順</option>
          <option value="price-desc">価格 高い順</option>
        </select>
      </div>

      <div class="field grow">
        <label for="f-brand-search">ブランド <span class="muted" id="brand-count"></span></label>
        <input id="f-brand-search" type="search" placeholder="ブランド名で絞り込む（例: ギャルソン、margiela）" autocomplete="off" />
        <div class="brand-chips" id="f-brands"></div>
      </div>
    </section>

    <div class="meta-row">
      <span id="result-count" class="count"></span>
      <span id="updated-at" class="muted"></span>
    </div>

    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>条件に合う商品がありません。絞り込みをゆるめてください。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>SeasonWear は楽天市場の商品を紹介するアフィリエイトサイトです。掲載価格・在庫は楽天側の表示が最新です。</p>
      <p class="credit">Supported by <a href="https://webservice.rakuten.co.jp/" target="_blank" rel="noopener">Rakuten Developers</a> — 商品データは楽天ウェブサービスを利用しています。</p>
    </div>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
