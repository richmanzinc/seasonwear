<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SeasonWear — ブランド古着をシーズンで探す</title>
  <meta name="description" content="デザイナーズ・ラグジュアリーブランドの古着を、デリバリーシーズンとメンズ/ウィメンズで絞り込める楽天アフィリエイトのまとめサイト。" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <span class="logo">SEASON<span>WEAR</span></span>
        <span class="tagline">ブランド古着を、シーズンで探す</span>
      </div>
      <p class="ad-note">本サイトは楽天アフィリエイトによる広告（PR）を含みます</p>
    </div>
  </header>

  <main class="wrap">
    <!-- トップ: 年 / シーズン -->
    <section class="controls controls-top" aria-label="シーズン絞り込み">
      <div class="field">
        <label for="f-year">年（デリバリー）</label>
        <select id="f-year"><option value="all">すべての年</option></select>
      </div>
      <div class="field">
        <label for="f-type">シーズン</label>
        <select id="f-type">
          <option value="all">すべて</option>
          <option value="SS">SS</option>
          <option value="AW">AW</option>
        </select>
      </div>
    </section>

    <!-- ブランド -->
    <section class="brand-block" aria-label="ブランド絞り込み">
      <div class="field grow">
        <label for="f-brand-search">ブランド <span class="muted" id="brand-count"></span></label>
        <input id="f-brand-search" type="search" placeholder="ブランド名で絞り込む（例: ギャルソン、margiela）" autocomplete="off" />
        <div class="brand-chips" id="f-brands"></div>
      </div>
    </section>

    <!-- 性別（ブランドの下） -->
    <section class="gender-block" aria-label="性別絞り込み">
      <div class="field">
        <label>性別</label>
        <div class="segmented" id="f-gender">
          <button data-val="all" class="active">すべて</button>
          <button data-val="MEN">メンズ</button>
          <button data-val="WOMEN">ウィメンズ</button>
        </div>
      </div>
    </section>

    <!-- 並び替え（商品の直上・ボタン）＋件数 -->
    <div class="toolbar">
      <div class="sort">
        <span class="sort-label">並び替え</span>
        <div class="segmented" id="f-sort">
          <button data-val="new" class="active">新着</button>
          <button data-val="price-asc">安い順</button>
          <button data-val="price-desc">高い順</button>
        </div>
      </div>
      <div class="toolbar-right">
        <span id="result-count" class="count"></span>
        <span id="updated-at" class="muted"></span>
      </div>
    </div>

    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>条件に合う商品がありません。絞り込みをゆるめてください。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>SeasonWear は楽天市場の商品を紹介するアフィリエイトサイトです。掲載価格・在庫は楽天側の表示が最新です。</p>
      <p class="credit">Supported by <a href="https://webservice.rakuten.co.jp/" target="_blank" rel="noopener">Rakuten Developers</a> — 商品データは楽天ウェブサービスを利用しています。</p>
    </div>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
